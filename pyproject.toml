[project]
name = "failsafe-translate-node"
description = "Fail-safe Google Translate node for ComfyUI with local CPU Marian/OPUS fallback."  
version = "1.1.0"
license = {file = "LICENSE"} 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = [
    "deep-translator==1.11.4",
    "transformers>=4.40",
    "sentencepiece>=0.2.0",
    "sacremoses>=0.1.1",
]

[project.urls]
Repository = "https://github.com/ah-kun/ComfyUI-FailSafe-Translate-Node"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/ah-kun/ComfyUI-FailSafe-Translate-Node/wiki"
"Bug Tracker" = "https://github.com/ah-kun/ComfyUI-FailSafe-Translate-Node/issues"

[tool.comfy]
PublisherId = "ah-kun"
DisplayName = "ComfyUI-FailSafe-Translate-Node"
Icon = ""
includes = [] 
